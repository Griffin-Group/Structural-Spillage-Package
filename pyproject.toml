[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-spillage"
version = "0.1.0"
description = "Structural spillage and spin-orbit plane-wave spillage from VASP WAVECARs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["numpy", "pymatgen", "matplotlib"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
structural-spillage = "structural_spillage.cli:main"
plot-per-band = "structural_spillage.plotting:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# lets the tests run from a checkout without `pip install`
pythonpath = ["src"]
